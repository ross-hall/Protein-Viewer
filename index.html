<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protein Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/ngl@2.4.0/dist/ngl.js"></script>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --panel-border:#262c36;
    --text:#e6e9ef;
    --muted:#8b93a1;
    --accent:#4f8cff;
    --accent-hover:#6b9eff;
    --danger:#ff6b6b;
    --input-bg:#0b0e13;
    --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;}
  #app{display:flex;height:100vh;width:100vw;}

  /* Sidebar */
  #sidebar{
    width:300px;min-width:300px;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;
    padding:20px 18px;
    overflow-y:auto;
    z-index:10;
  }
  #sidebar h1{
    font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:-0.01em;
  }
  #sidebar .subtitle{font-size:12px;color:var(--muted);margin:0 0 18px;}

  .section{margin-bottom:20px;}
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;margin-bottom:8px;display:block;
  }

  #loadRow{display:flex;gap:6px;}
  #pdbInput{
    flex:1;background:var(--input-bg);border:1px solid var(--panel-border);
    color:var(--text);border-radius:var(--radius);padding:9px 11px;font-size:14px;
    outline:none;min-width:0;text-transform:uppercase;
  }
  #pdbInput:focus{border-color:var(--accent);}
  #pdbInput::placeholder{text-transform:none;color:#5b6472;}

  button{
    font-family:inherit;cursor:pointer;border:none;
  }
  #loadBtn{
    background:var(--accent);color:#fff;border-radius:var(--radius);
    padding:9px 16px;font-size:14px;font-weight:600;white-space:nowrap;
    transition:background .15s;
  }
  #loadBtn:hover{background:var(--accent-hover);}
  #loadBtn:disabled{background:#38404d;cursor:not-allowed;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{
    background:var(--input-bg);border:1px solid var(--panel-border);color:var(--muted);
    font-size:11.5px;padding:4px 9px;border-radius:999px;transition:all .15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--text);}

  #status{font-size:12.5px;margin-top:10px;min-height:16px;}
  #status.loading{color:var(--accent);}
  #status.error{color:var(--danger);}
  #status.ok{color:#5fd48a;}

  .seg{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
  }
  .seg button{
    background:var(--input-bg);border:1px solid var(--panel-border);color:var(--text);
    border-radius:8px;padding:9px 6px;font-size:12.5px;font-weight:500;
    transition:all .15s;
  }
  .seg button:hover{border-color:var(--accent);}
  .seg button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  select{
    width:100%;background:var(--input-bg);border:1px solid var(--panel-border);
    color:var(--text);border-radius:var(--radius);padding:9px 11px;font-size:13.5px;
    outline:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%238b93a1' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
  }
  select:focus{border-color:var(--accent);}

  .row-check{display:flex;align-items:center;justify-content:space-between;padding:2px 0;}
  .row-check label{font-size:13.5px;color:var(--text);}
  .switch{position:relative;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;background:var(--input-bg);border:1px solid var(--panel-border);
    border-radius:999px;cursor:pointer;transition:.15s;
  }
  .slider:before{
    content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;
    background:var(--muted);border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(16px);background:#fff;}

  .btn-row{display:flex;gap:6px;}
  .btn-secondary{
    flex:1;background:var(--input-bg);border:1px solid var(--panel-border);color:var(--text);
    border-radius:var(--radius);padding:9px 8px;font-size:12.5px;font-weight:500;
    transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

  #info{
    background:var(--input-bg);border:1px solid var(--panel-border);border-radius:var(--radius);
    padding:11px 12px;font-size:12px;color:var(--muted);line-height:1.6;
  }
  #info .info-title{color:var(--text);font-weight:600;font-size:13px;margin-bottom:4px;}
  #info .info-row span{color:var(--text);}

  .footer-note{margin-top:auto;padding-top:16px;font-size:11px;color:#4d5563;line-height:1.5;}
  .footer-note a{color:#5b6472;}

  /* Viewer */
  #viewerWrap{flex:1;position:relative;}
  #viewport{width:100%;height:100%;}

  #hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:var(--muted);font-size:14px;pointer-events:none;text-align:center;
  }
  #hint b{color:var(--text);font-size:16px;font-weight:600;display:block;margin-bottom:6px;}

  #spinner{
    position:absolute;top:18px;right:18px;
    width:22px;height:22px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:spin .7s linear infinite;display:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:720px){
    #app{flex-direction:column;}
    #sidebar{width:100%;min-width:0;height:auto;max-height:52vh;border-right:none;border-bottom:1px solid var(--panel-border);}
  }
</style>
</head>
<body>
<div id="app">

  <div id="sidebar">
    <h1>Protein Viewer</h1>
    <p class="subtitle">Enter an RCSB PDB ID to load a structure</p>

    <div class="section">
      <span class="section-label">Structure</span>
      <div id="loadRow">
        <input id="pdbInput" type="text" placeholder="e.g. 1CRN" maxlength="8" autocomplete="off" spellcheck="false">
        <button id="loadBtn">Load</button>
      </div>
      <div class="chips" id="examples">
        <button class="chip" data-id="1CRN">1CRN</button>
        <button class="chip" data-id="6VXX">6VXX</button>
        <button class="chip" data-id="2E4A">2E4A</button>
        <button class="chip" data-id="1HHO">1HHO</button>
        <button class="chip" data-id="4HHB">4HHB</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="section">
      <span class="section-label">Representation</span>
      <div class="seg" id="repSeg">
        <button data-rep="cartoon" class="active">Cartoon</button>
        <button data-rep="ribbon">Ribbon</button>
        <button data-rep="tube">Tube</button>
        <button data-rep="trace">Trace</button>
        <button data-rep="licorice">Stick</button>
        <button data-rep="ball+stick">Ball &amp; Stick</button>
        <button data-rep="spacefill">Sphere</button>
        <button data-rep="surface">Surface</button>
      </div>
    </div>

    <div class="section">
      <span class="section-label">Color scheme</span>
      <select id="colorScheme">
        <option value="chainid">By chain</option>
        <option value="sstruc">By secondary structure</option>
        <option value="element">By element</option>
        <option value="residuetype">By residue type</option>
        <option value="bfactor">By B-factor</option>
        <option value="resnum">Rainbow (spectrum)</option>
        <option value="hydrophobicity">Hydrophobicity</option>
      </select>
    </div>

    <div class="section">
      <div class="row-check">
        <label for="showHetero">Show ligands / waters</label>
        <label class="switch">
          <input type="checkbox" id="showHetero" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="row-check">
        <label for="spinToggle">Auto-rotate</label>
        <label class="switch">
          <input type="checkbox" id="spinToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row-check">
        <label for="bgToggle">Light background</label>
        <label class="switch">
          <input type="checkbox" id="bgToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="btn-row">
        <button class="btn-secondary" id="resetBtn">Reset view</button>
        <button class="btn-secondary" id="pngBtn">Export PNG</button>
      </div>
    </div>

    <div class="section" id="infoSection" style="display:none;">
      <span class="section-label">Details</span>
      <div id="info"></div>
    </div>

    <div class="footer-note">
      Structure data from the <a href="https://www.rcsb.org" target="_blank" rel="noopener">RCSB Protein Data Bank</a>. Rendered with NGL.js, entirely in your browser.
    </div>
  </div>

  <div id="viewerWrap">
    <div id="viewport"></div>
    <div id="spinner"></div>
    <div id="hint"><div><b>No structure loaded</b>Enter a PDB ID on the left to get started</div></div>
  </div>

</div>

<script>
(function(){
  var stage = new NGL.Stage("viewport", { backgroundColor: "#0e1116" });
  window.addEventListener("resize", function(){ stage.handleResize(); }, false);

  var state = {
    rep: "cartoon",
    color: "chainid",
    showHetero: true,
    component: null
  };

  var pdbInput = document.getElementById("pdbInput");
  var loadBtn = document.getElementById("loadBtn");
  var statusEl = document.getElementById("status");
  var spinner = document.getElementById("spinner");
  var hint = document.getElementById("hint");
  var infoSection = document.getElementById("infoSection");
  var infoEl = document.getElementById("info");

  function setStatus(msg, kind){
    statusEl.textContent = msg || "";
    statusEl.className = kind || "";
  }

  function applyRepresentation(){
    if (!state.component) return;
    state.component.removeAllRepresentations();

    var mainSel = state.showHetero ? "polymer" : "polymer";
    state.component.addRepresentation(state.rep, {
      sele: mainSel,
      color: state.color
    });

    if (state.showHetero){
      state.component.addRepresentation("ball+stick", {
        sele: "hetero and not water",
        color: state.color
      });
      state.component.addRepresentation("spacefill", {
        sele: "water",
        color: state.color,
        scale: 0.25,
        opacity: 0.6
      });
    }
  }

  function showInfo(structure, id){
    var chains = {};
    structure.eachChain(function(c){ if(c.residueCount>0) chains[c.chainname]=true; });
    var chainList = Object.keys(chains).join(", ") || "—";
    var title = (structure.title || "").trim();
    infoEl.innerHTML =
      '<div class="info-title">' + id.toUpperCase() + (title ? " — " + title : "") + '</div>' +
      '<div class="info-row">Chains: <span>' + chainList + '</span></div>' +
      '<div class="info-row">Residues: <span>' + structure.residueStore.count + '</span></div>' +
      '<div class="info-row">Atoms: <span>' + structure.atomStore.count + '</span></div>';
    infoSection.style.display = "block";
  }

  function loadStructure(id){
    id = (id || "").trim().toUpperCase();
    if (!id){ setStatus("Enter a PDB ID first.", "error"); return; }
    if (!/^[A-Z0-9]{3,8}$/.test(id)){
      setStatus("That doesn't look like a valid PDB ID.", "error");
      return;
    }

    loadBtn.disabled = true;
    spinner.style.display = "block";
    setStatus("Loading " + id + " from RCSB…", "loading");

    if (state.component){
      stage.removeComponent(state.component);
      state.component = null;
    }

    stage.loadFile("rcsb://" + id)
      .then(function(component){
        state.component = component;
        applyRepresentation();
        stage.autoView();
        hint.style.display = "none";
        setStatus("Loaded " + id + ".", "ok");
        showInfo(component.structure, id);
      })
      .catch(function(err){
        console.error(err);
        setStatus("Couldn't load \"" + id + "\" — check the PDB ID and try again.", "error");
        infoSection.style.display = "none";
        hint.style.display = "flex";
      })
      .then(function(){
        loadBtn.disabled = false;
        spinner.style.display = "none";
      });
  }

  loadBtn.addEventListener("click", function(){ loadStructure(pdbInput.value); });
  pdbInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadStructure(pdbInput.value);
  });

  document.getElementById("examples").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) return;
    pdbInput.value = btn.dataset.id;
    loadStructure(btn.dataset.id);
  });

  var repSeg = document.getElementById("repSeg");
  repSeg.addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if (!btn) return;
    Array.prototype.forEach.call(repSeg.children, function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    state.rep = btn.dataset.rep;
    applyRepresentation();
  });

  document.getElementById("colorScheme").addEventListener("change", function(e){
    state.color = e.target.value;
    applyRepresentation();
  });

  document.getElementById("showHetero").addEventListener("change", function(e){
    state.showHetero = e.target.checked;
    applyRepresentation();
  });

  document.getElementById("spinToggle").addEventListener("change", function(e){
    stage.setSpin(e.target.checked);
  });

  document.getElementById("bgToggle").addEventListener("change", function(e){
    var light = e.target.checked;
    stage.setParameters({ backgroundColor: light ? "#f4f6f9" : "#0e1116" });
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    stage.autoView(400);
  });

  document.getElementById("pngBtn").addEventListener("click", function(){
    stage.viewer.makeImage({ factor: 2, antialias: true, trim: false, transparent: false })
      .then(function(blob){
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = (pdbInput.value.trim() || "structure") + ".png";
        link.click();
      });
  });

  // Load a default structure on first open
  loadStructure("1CRN");
})();
</script>
</body>
</html>
